<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Browser Translations</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="popup.css" />
  <script src="theme.js"></script>
  <style>
    /* Overrides the shared styles.css `body { display:flex; justify-content:center }`
       rule (meant for popup/options cards). Without this, body's flex-row
       layout sizes .sidebar-page to its *content* width, which is what
       made the whole sidebar visibly shrink/grow with how much text was
       showing (empty during loading/errors, wide once translated). */
    body {
      display: block;
      margin: 0;
      padding: 1rem;
      background-color: var(--background);
      color: var(--foreground);
      font-size: 15px;
      width: auto;
      min-width: 0;
    }

    .sidebar-page {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      overflow: hidden;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4em;
      flex-wrap: wrap;
      padding-bottom: 0.6em;
      margin-bottom: 0.75em;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      position: relative;
    }

    .toolbar-logo {
      width: 32px;
      height: 32px;
      flex-shrink: 0;
      border-radius: 6px;
    }

    #uiLangSelect {
      flex: 0 0 auto;
      width: auto;
      height: 32px;
      box-sizing: border-box;
      padding: 0 6px;
    }

    /* Extra breathing room between logical control groups in the toolbar
       (language pair / engine / engine-settings+translate / theme), on top
       of the smaller default gap used between elements within a group. */
    .toolbar-group-gap {
      margin-left: 1.8em;
    }

    .toolbar select {
      width: auto;
      min-width: 0;
      height: 32px;
      box-sizing: border-box;
      padding: 0 6px;
      font-size: 12px;
      flex: 1 1 auto;
    }

    .toolbar-arrow {
      color: var(--text-secondary);
    }

    .btn-sm {
      height: 32px;
      box-sizing: border-box;
      padding: 0 14px;
      font-size: 13px;
    }

    .icon-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      padding: 0;
      font-size: 19px;
      line-height: 1;
    }

    .toolbar .theme-toggle {
      width: 32px;
      height: 32px;
      box-sizing: border-box;
      font-size: 14px;
    }

    .engine-settings-panel {
      width: 100%;
      order: 10;
      box-sizing: border-box;
      margin-top: 0.5em;
      padding: 0.75em 0.9em;
      background: linear-gradient(180deg, var(--surface-top), var(--surface-bottom));
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .engine-settings-panel[hidden] {
      display: none;
    }

    .engine-settings-panel .form-group {
      margin-bottom: 0.6em;
    }

    .engine-settings-panel .form-group:last-child {
      margin-bottom: 0;
    }

    .engine-settings-panel label {
      font-size: 12px;
    }

    .engine-settings-panel input {
      font-size: 13px;
      padding: 6px 8px;
    }

    .engine-usage-hint {
      margin-top: 0.5em;
      margin-bottom: 0;
    }

    .reading-pane {
      flex: 1;
      width: 100%;
      min-height: 0;
      box-sizing: border-box;
      overflow-y: auto;
      background: linear-gradient(180deg, var(--surface-top), var(--surface-bottom));
      padding: 1em;
      border: 1px solid var(--border);
      border-radius: 6px;
      box-shadow: var(--shadow);
    }

    /* Light theme only: flat, lightest-possible background (no gradient)
       plus darker accent text colors - the mid-brightness gold/green used
       on dark backgrounds are too low-contrast against a light surface. */
    :root[data-theme="light"] .reading-pane {
      background: var(--neutral-1);
    }

    .line-pair {
      margin-bottom: 1.1em;
    }

    .line-original,
    .line-translated {
      line-height: 1.4;
      white-space: pre-wrap; /* Respects newlines in text */
      margin: 0 0 0.25em 0;
    }

    .line-original {
      color: var(--primary-1);
    }

    .line-translated {
      color: var(--accent-2);
    }

    :root[data-theme="light"] .line-original {
      color: var(--primary-dark);
    }

    :root[data-theme="light"] .line-translated {
      color: var(--secondary-dark);
    }

    /* Structure-preserving block wrappers - see extractStructuredBlocks()
       in content.js and renderParallelBlocks() in sidebar.js. */
    .reading-heading,
    .reading-paragraph,
    .reading-quote,
    .reading-list {
      margin: 0 0 1.3em 0;
    }

    .reading-heading {
      font-weight: 700;
    }
    h1.reading-heading { font-size: 1.5em; }
    h2.reading-heading { font-size: 1.32em; }
    h3.reading-heading { font-size: 1.18em; }
    h4.reading-heading,
    h5.reading-heading,
    h6.reading-heading { font-size: 1.06em; }

    .reading-quote {
      padding-left: 0.9em;
      border-left: 3px solid var(--border);
      font-style: italic;
    }

    .reading-list {
      margin: 0 0 1.3em 0;
      padding-left: 1.6em;
    }

    .reading-list li {
      margin-bottom: 0.6em;
    }

    .reading-list li:last-child {
      margin-bottom: 0;
    }

    /* Last line-pair inside any block shouldn't add extra trailing space
       on top of the block's own bottom margin. */
    .reading-heading .line-pair:last-child,
    .reading-paragraph .line-pair:last-child,
    .reading-quote .line-pair:last-child,
    .reading-list li .line-pair:last-child {
      margin-bottom: 0;
    }

    .welcome-text,
    .loading-text {
      color: var(--text-secondary);
      font-style: italic;
      text-align: center;
      margin-top: 2em;
    }

    .error-text {
      color: var(--error);
      font-style: italic;
      text-align: center;
      margin-top: 2em;
    }
  </style>
</head>
<body>
  <div class="sidebar-page">
    <div class="toolbar">
      <img class="toolbar-logo" src="icons/icon-32.png" alt="Browser Translations" />
      <select id="uiLangSelect" class="toolbar-group-gap" title="Interface language"></select>
      <select id="fromLang" class="toolbar-group-gap" title="Translate from"></select>
      <span class="toolbar-arrow">&#8594;</span>
      <select id="toLang" title="Translate to"></select>
      <select id="scopeSelect" class="toolbar-group-gap" title="Translation scope"></select>
      <select id="engineSelect" class="toolbar-group-gap" title="Translation engine"></select>
      <button id="engineSettingsBtn" class="btn btn-grey icon-btn" title="Engine settings">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
          <path d="M19.14,12.94c0.04,-0.3,0.06,-0.61,0.06,-0.94c0,-0.32,-0.02,-0.64,-0.07,-0.94l2.03,-1.58c0.18,-0.14,0.23,-0.41,0.12,-0.61l-1.92,-3.32c-0.12,-0.22,-0.37,-0.29,-0.59,-0.22l-2.39,0.96c-0.5,-0.38,-1.03,-0.7,-1.62,-0.94L14.4,2.81c-0.04,-0.24,-0.24,-0.41,-0.48,-0.41h-3.84c-0.24,0,-0.43,0.17,-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22,-0.08,-0.47,0,-0.59,0.22L2.74,8.87C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.07,0.94l-2.03,1.58c-0.18,0.14,-0.23,0.41,-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39,-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44,-0.17,0.47,-0.41l0.36,-2.54c0.59,-0.24,1.13,-0.56,1.62,-0.94l2.39,0.96c0.22,0.08,0.47,0,0.59,-0.22l1.92,-3.32c0.12,-0.22,0.07,-0.47,-0.12,-0.61L19.14,12.94z M12,15.6c-1.98,0,-3.6,-1.62,-3.6,-3.6s1.62,-3.6,3.6,-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z" />
        </svg>
      </button>
      <button id="translateBtn" class="btn btn-green btn-sm toolbar-group-gap" title="Translate this page">Translate</button>
      <button id="historyPrevBtn" class="btn btn-grey icon-btn toolbar-group-gap" title="Previous translation" disabled>&#8592;</button>
      <button id="historyNextBtn" class="btn btn-grey icon-btn" title="Next translation" disabled>&#8594;</button>
      <button id="clearHistoryBtn" class="btn btn-grey icon-btn" title="Clear all translations" disabled>
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true">
          <path d="M9 3h6l1 2h4v2H4V5h4l1-2zm-3 6h12l-1 12H7L6 9zm4 2v8h2v-8h-2zm4 0v8h2v-8h-2z" />
        </svg>
      </button>
      <button id="themeToggle" class="theme-toggle toolbar-group-gap" title="Toggle theme">&#9728;&#65039;</button>

      <div class="engine-settings-panel" id="engineSettingsPanel" hidden>
        <div class="form-group" id="apiKeyGroup">
          <label for="apiKeyInput" id="apiKeyLabelText">API key</label>
          <p class="api-key-security-note" id="apiKeySecurityNote"></p>
          <input type="password" id="apiKeyInput" autocomplete="off" placeholder="sk-..." />
        </div>
        <div class="form-group" id="modelGroup">
          <label for="modelInput"><span id="modelLabelText">Model</span></label>
          <input type="text" id="modelInput" />
        </div>
        <div class="form-group" id="baseUrlGroup">
          <label for="baseUrlInput" id="ollamaUrlLabelText">Ollama server URL</label>
          <p class="lingva-alternatives-note" id="lingvaAlternativesNote"></p>
          <input type="text" id="baseUrlInput" placeholder="http://localhost:11434" />
        </div>
        <div class="form-group" id="capCharsGroup">
          <label for="capCharsInput"><span id="capCharsLabelText">Local translation cap (characters)</span></label>
          <input type="number" id="capCharsInput" min="500" step="500" />
        </div>
        <p class="hint-text engine-usage-hint" id="usageHint"></p>
      </div>
    </div>

    <p class="privacy-note" id="privacyNote"></p>
    <div class="reading-pane" id="reading-pane"></div>
  </div>

  <script type="module" src="sidebar.js"></script>
  <script type="module" src="popup.js"></script>
</body>
</html>
